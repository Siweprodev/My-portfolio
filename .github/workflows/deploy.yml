name: Deploy React Portfolio

on: [push, workflow_dispatch]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sanelisiwe-react-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: sanelisiwe-react-portfolio
        run: npm ci

      - name: Build React application
        working-directory: sanelisiwe-react-portfolio
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: sanelisiwe-react-portfolio/dist

      - name: Deploy website
        uses: actions/deploy-pages@v4
